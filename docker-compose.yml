# =============================================================================
# Dispatch — Production Compose (Contabo VPS)
# =============================================================================
#
# Architecture:
#   Cloudflare Pages (frontend)  ──https──>  Caddy (this host, :443)
#                                              │
#                                              ▼
#                                          dispatch-app (:3000, internal)
#                                              │
#                                              ▼
#                                  Cloudflare Worker (tracking, separate)
#
# Setup:
#   1. Point an A record (e.g. api.yourdomain.com) at this VPS
#   2. cp .env.example .env  and fill in:
#        BACKEND_DOMAIN=api.yourdomain.com
#        FRONTEND_URL=https://dispatch.pages.dev   (or your Pages domain)
#        BASE_URL=https://api.yourdomain.com
#        SESSION_SECRET=<openssl rand -hex 32>
#        TRACKING_WORKER_URL=https://...workers.dev
#        GOOGLE_CLIENT_ID/SECRET, MICROSOFT_CLIENT_ID/SECRET
#   3. docker compose up -d --build
#   4. Caddy will auto-provision a Let's Encrypt cert for BACKEND_DOMAIN
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend: Bun + Hono. Not exposed to the internet directly.
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dispatch-app
    expose:
      - "3000"
    volumes:
      - ./data:/app/data         # SQLite (users, scheduler, queue)
      - ./logs:/app/logs         # JSON email logs
      - ./uploads:/app/uploads   # Uploaded Excel sheets
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - dispatch-net
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ---------------------------------------------------------------------------
  # Caddy: TLS termination + reverse proxy. Auto-renews Let's Encrypt certs.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: dispatch-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data         # cert storage (DO NOT delete — has private keys)
      - caddy-config:/config
    environment:
      - BACKEND_DOMAIN=${BACKEND_DOMAIN}
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - dispatch-net

  # ---------------------------------------------------------------------------
  # Tracking Worker is deployed separately to Cloudflare:
  #   cd tracking-worker && bunx wrangler deploy
  # Set TRACKING_WORKER_URL in .env to its URL.
  # ---------------------------------------------------------------------------

networks:
  dispatch-net:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
