<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispatch API Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *::before, *::after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }

    /* Top bar */
    .topbar-wrapper {
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    /* Hide default Swagger UI topbar and use our own */
    .swagger-ui .topbar { display: none; }

    .custom-header {
      background: #1a1a2e;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .custom-header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .custom-header span {
      font-size: 13px;
      opacity: 0.7;
    }
    .custom-header a {
      color: #7c83ff;
      text-decoration: none;
      font-size: 14px;
    }
    .custom-header a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="custom-header">
    <div>
      <h1>Dispatch API Explorer</h1>
      <span>v3.0.0 &mdash; Bulk email campaign platform</span>
    </div>
    <a href="https://github.com/iamjpsingh/bulk-email-sender" target="_blank" rel="noopener">GitHub</a>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = () => {
      // Resolve the spec URL relative to this HTML file
      const specUrl = new URL('openapi.yaml', window.location.href).href;

      SwaggerUIBundle({
        url: specUrl,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset,
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl,
        ],
        layout: 'StandaloneLayout',
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 2,
        docExpansion: 'list',
        filter: true,
        showExtensions: true,
        showCommonExtensions: true,
        tryItOutEnabled: false,
        persistAuthorization: true,
      });
    };
  </script>
</body>
</html>
